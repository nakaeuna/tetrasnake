<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TetraSnake - Démo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <div class="game-wrapper">
        <main class="game-layout">
            <canvas id="canvas-serpent" width="710" height="868"></canvas>
            <canvas id="canvas-blocs" width="520" height="868"></canvas>
        </main>
    </div>
</div>

<div id="game-overlay" class="game-overlay hidden" aria-hidden="true">
    <div class="overlay-backdrop" aria-hidden="true"></div>
    <div class="overlay-card">
        <div id="perdu-text" class="overlay-title">Game Over</div>
        <p id="overlay-sous-titre" class="overlay-hint"></p>
        <button id="recommencer-btn" type="button" class="recommencer-btn">Recommencer (R)</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
